spring.application.name=RIDE-GATEWAY
server.port=8000
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.routes[0].id=ride-service
spring.cloud.gateway.routes[0].uri=lb://RIDE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/rides,/rides/**

spring.cloud.gateway.routes[1].id=rider-service
spring.cloud.gateway.routes[1].uri=lb://RIDER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/riders,/riders/**
